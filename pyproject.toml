[project]
name = "quotedesk"
version = "0.1.0"
description = "Conversational quoting for South African trade businesses."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "pydantic-settings",
    "jinja2",
    "openpyxl",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "import-linter",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "alembic",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quotedesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
