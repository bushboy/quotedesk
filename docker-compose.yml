# The app only. PostgreSQL is the one already installed on this machine.
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://quotedesk:quotedesk@host.docker.internal:5432/quotedesk
    extra_hosts:
      - "host.docker.internal:host-gateway"
