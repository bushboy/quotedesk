version: fab-policy-v1.0
sam_score_threshold: '0.80'
range_minimum: '850.00'
rate_card_codes:
- SHEET-ECO
- SHEET-POLY
rules:
- rule_id: FAB-E01
  priority: 0
  outcome: escalation
  customer_template: I can't use that message to change the quote. Please phone the
    business and we'll take it from there.
  reason: 'Flagged as an injection for the owner: the message instructs the assistant
    or claims an approval.'
- rule_id: FAB-E02
  priority: 0
  outcome: escalation
  customer_template: We can't price this while the opening looks unsafe. Please leave
    that glass and the lintel alone until we've checked them.
  reason: The lintel is cracked, or glass is broken in place.
- rule_id: FAB-E03
  priority: 0
  outcome: escalation
  customer_template: We can't price this until someone has checked the old sheeting.
    Please don't cut or scrape it.
  reason: Old carport sheeting may contain asbestos.
- rule_id: FAB-S01
  priority: 1
  outcome: site_assessment
  customer_template: A new or widened opening needs a site measure. If you go ahead,
    the visit fee is credited against the work.
  reason: The opening is new or widened.
- rule_id: FAB-S02
  priority: 1
  outcome: site_assessment
  customer_template: This one needs a site measure before we can give you a price.
  reason: The job is above the ground floor, or it is more than one opening.
- rule_id: FAB-F01
  priority: 1
  outcome: fixed_offer
  customer_template: We can send a fixed quote for this replacement.
  reason: Replacement in the existing opening, standard size and finish.
- rule_id: FAB-R01
  priority: 1
  outcome: indicative_range
  customer_template: We can send a price range for this carport. It depends on the
    roof covering.
  reason: 6 m by 7 m with the finish not chosen.
- rule_id: FAB-B01
  priority: 1
  outcome: indicative_range
  customer_template: We can send a price range, and the nearest option we fit to a
    smaller budget.
  reason: The nearest affordable option is SHEET-ECO.
- rule_id: FAB-L01
  priority: 1
  outcome: site_assessment
  customer_template: We need a tape measure in the frame before we can price this.
    A site measure is the sure way.
  reason: Confidence is low and no earlier rule matched.
- rule_id: FAB-L02
  priority: 1
  outcome: site_assessment
  customer_template: We don't have a standard price for this job. A site measure
    is the next step.
  reason: No priced rule matches at this confidence.
